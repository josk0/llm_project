name: llm_finetuning_new
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11

  # PyTorch with CUDA support (pytorch channel handles CUDA automatically)
  - pytorch=2.4.*
  - pytorch-cuda=12.1

  # System libraries
  - h5py
  - numpy
  - scikit-learn

  # Random: transitive dependency that wasn't resolved
  - emoji

  - pip
  - pip:
    - transformers>=4.40.0
    - datasets>=2.14.0
    - accelerate>=0.27.0
    - peft>=0.7.0
    - trl>=0.8.0
    - sentence-transformers>=2.2.0

    # Utilities
    - tqdm>=4.66.0
    - python-dotenv>=1.0.0

    # Monitoring
    - wandb>=0.15.0
    - lighteval>=0.3.0

variables:
  CUDA_HOME: $CONDA_PREFIX
